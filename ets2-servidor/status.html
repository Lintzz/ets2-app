<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETS2 Dashboard Server Status</title>
    <!-- Inclui Tailwind CSS para estilização moderna e rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        /* Garante que o corpo da página não tenha scroll */
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* Estiliza o cabeçalho para permitir arrastar e ignora o scroll */
      .custom-title-bar {
        /* Propriedade ESSENCIAL para arrastar a janela (exceto nos botões) */
        -webkit-app-region: drag;
      }

      /* Impede que os botões customizados sejam arrastáveis */
      .window-control {
        -webkit-app-region: no-drag;
      }

      /* Classe para o container principal de conteúdo - usa flex-col */
      .main-content {
        flex-grow: 1;
        padding: 1rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Define a altura máxima para a caixa de logs, permitindo apenas ela ter scroll */
      #log-box {
        background-color: #1a202c; /* Cor de fundo mais escura para o log */
        border-radius: 0.5rem;
        padding: 0.75rem;
        overflow-y: auto; /* Apenas o log terá scroll vertical */
        flex-grow: 1; /* Ocupa o espaço vertical restante */
        font-size: 0.75rem;
        white-space: pre-wrap;
        line-height: 1.5;
        box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.6);
        /* Garante que o logbox tenha uma altura mínima para aparecer */
        min-height: 100px;
      }

      /* Ajuste do rodapé para fixar ao fundo */
      footer {
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
      }
    </style>
  </head>
  <body class="bg-gray-900 text-gray-200">
    <!-- BARRA DE TÍTULO CUSTOMIZADA -->
    <header
      class="custom-title-bar bg-gray-800 border-b-2 border-green-500 flex justify-between items-center px-4 py-1.5 h-10"
    >
      <div class="flex items-center">
        <span class="mr-2 text-green-500 text-lg">🚛</span>
        <span class="text-sm font-semibold">ETS2 Server Status</span>
      </div>

      <!-- BOTÕES DE CONTROLE DA JANELA -->
      <div class="flex">
        <button
          id="minimize-btn"
          class="window-control hover:bg-gray-700 w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-white transition duration-150"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-dash"
            viewBox="0 0 16 16"
          >
            <path
              d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8"
            />
          </svg>
        </button>
        <button
          id="maximize-btn"
          class="window-control hover:bg-gray-700 w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-white transition duration-150 mx-1"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="currentColor"
            class="bi bi-square"
            viewBox="0 0 16 16"
          >
            <path
              d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"
            />
          </svg>
        </button>
        <button
          id="close-btn"
          class="window-control hover:bg-red-600 w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-white transition duration-150"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-x-lg"
            viewBox="0 0 16 16"
          >
            <path
              d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"
            />
          </svg>
        </button>
      </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (LAYOUT VERTICAL PARA FORÇAR LOG PARA BAIXO) -->
    <main class="main-content">
      <div
        class="max-w-4xl w-full mx-auto flex-grow flex flex-col overflow-hidden"
      >
        <!-- 1. PAINEL DE STATUS PRINCIPAL (Fixo no Topo da Área de Conteúdo) -->
        <div
          id="main-status-panel"
          class="mb-4 p-4 rounded-lg shadow-xl transition duration-300 flex-shrink-0 bg-gray-800"
        >
          <div id="server-status" class="text-lg font-semibold mb-2">
            Status do Servidor:
            <span id="status-text" class="text-gray-400">Iniciando...</span>
          </div>
          <div id="ip-address" class="text-sm text-gray-400">
            IP Servidor:
            <span id="ip-text" class="font-mono text-xs text-green-400"
              >Aguardando...</span
            >
          </div>
          <div id="client-info" class="text-sm text-gray-400 mt-1">
            Cliente Conectado:
            <span id="client-text" class="font-mono text-xs">Nenhum</span>
          </div>
        </div>

        <!-- 2. PAINEL DE AÇÕES (Fixo - logo abaixo do status) -->
        <div class="mb-4 flex-shrink-0">
          <h2 class="text-xl font-bold mb-3 text-green-500">Ações</h2>
          <button
            id="restart-server-btn"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50"
          >
            <span class="mr-1">🔄</span> Reiniciar Servidor
          </button>
        </div>

        <!-- 3. PAINEL DE LOGS (Ocupa o espaço restante e TEM SCROLL) -->
        <div class="flex flex-col flex-grow overflow-hidden">
          <h2 class="text-xl font-bold mb-3 text-green-500 flex-shrink-0">
            Log de Eventos
          </h2>
          <div id="log-box">
            <!-- Logs serão injetados aqui -->
          </div>
        </div>
      </div>

      <footer
        class="mt-4 pt-2 border-t-2 border-green-700 text-xs text-center text-gray-500 flex-shrink-0"
      >
        Dashboard Server v1.0 | Desenvolvido com Electron
      </footer>
    </main>

    <script src="status_renderer.js"></script>
  </body>
</html>
